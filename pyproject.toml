[project]
name = "earthquake-rag"
version = "0.1.0"
description = "A temporal and agentic RAG application built with real USGS earthquake data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
