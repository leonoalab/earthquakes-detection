[project]
name = "earthquake-rag"
version = "0.1.0"
description = "A temporal and agentic RAG application built with real USGS earthquake data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.5",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.1",
    "langgraph-checkpoint-postgres>=3.1.3",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.3.6",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
earthquake-rag = "earthquake_rag.presentation.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
